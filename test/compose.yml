# Local test only (Daytona): the same Dockerfiles and variables the Railway template uses.
# MinIO stands in for the Railway Bucket here.
services:
  postgres:
    image: postgres:18
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: testpass, POSTGRES_DB: railway }
    volumes: [pgdata:/var/lib/postgresql]
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment: { MINIO_ROOT_USER: testaccess, MINIO_ROOT_PASSWORD: testsecret123 }
    volumes: [miniodata:/data]
  browserless:
    build: ../browserless
  lightdash:
    build: ../lightdash
    depends_on: [postgres, minio, browserless]
    ports: ["8080:8080"]
    environment: &ld
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: testpass
      PGDATABASE: railway
      LIGHTDASH_SECRET: local-test-secret-not-for-prod-123456
      SITE_URL: http://localhost:8080
      SECURE_COOKIES: "false"
      HEADLESS_BROWSER_HOST: browserless
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: lightdash
      S3_REGION: us-east-1
      S3_ACCESS_KEY: testaccess
      S3_SECRET_KEY: testsecret123
      S3_FORCE_PATH_STYLE: "true"
  scheduler:
    build: ../scheduler
    depends_on: [postgres, minio, browserless]
    environment: *ld
volumes: { pgdata: {}, miniodata: {} }
